when:
  - event: push
    branch: trunk

steps:
  - name: build
    image: debian
    commands:
      - apt-get update && apt-get install -y gcc make
      - ./configure && make
      - ./antcc -v

  - name: test-bootstrap
    image: debian
    commands:
      - apt-get update && apt-get install -y make gcc
      - ./test/bootstrap.sh

  - name: test-c
    image: debian
    commands:
      - apt-get update && apt-get install -y gcc
      - ./test/c/run.sh --print

    depends_on: [build]

  - name: test-ir
    image: debian
    commands:
      - apt-get update && apt-get install -y gcc tcl
      - ./test/ir/run.sh
    depends_on: [build]

  - name: test-external-metalang99
    image: debian
    commands:
      - apt-get update && apt-get install -y curl cmake make unzip
      - ./test/external/metalang99.sh
    depends_on: [build]

  - name: test-external-lua
    image: debian
    commands:
      - apt-get update && apt-get install -y gcc make curl
      - ./test/external/lua.sh
    depends_on: [build]

  - name: test-external-qbe
    image: debian
    commands:
      - apt-get update && apt-get install -y gcc make curl xz-utils
      - ./test/external/qbe.sh
    depends_on: [build]
